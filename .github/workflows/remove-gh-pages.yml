name: Remove legacy Pages branch

on:
  workflow_run:
    workflows: [Deploy Argon dashboard]
    types: [completed]

permissions:
  contents: write

jobs:
  remove:
    name: Delete gh-pages after successful deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete obsolete gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$GH_REPO/git/ref/heads/gh-pages" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/gh-pages"
            echo "Deleted gh-pages after a successful main-based Pages deployment."
          else
            echo "gh-pages is already absent."
          fi
