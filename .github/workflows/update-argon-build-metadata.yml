name: Update argon-build metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/package-metadata/argon-build-description.txt'
      - '.github/workflows/update-argon-build-metadata.yml'
  workflow_run:
    workflows: [Build prepared Chromium image, Build Argon]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: argon-build-metadata
  cancel-in-progress: true

jobs:
  metadata:
    name: Update GHCR description without rebuilding Chromium
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Check whether image publication is active
        id: safe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh api "repos/$GH_REPO/actions/workflows/build-chromium-image.yml/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if (( active > 0 )); then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Prepared-image publication is active; metadata will be reconciled when it completes."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.safe.outputs.apply == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane metadata client
        if: steps.safe.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Reconcile image description without rebuilding layers
        if: steps.safe.outputs.apply == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/argon-build
        shell: bash
        run: |
          set -euo pipefail
          description=$(tr -d '\r\n' < .github/package-metadata/argon-build-description.txt)
          [[ -n "$description" ]]
          [[ ${#description} -le 512 ]]

          current=$(crane config "$IMAGE:branch-main" | jq -r '.config.Labels["org.opencontainers.image.description"] // ""')
          if [[ "$current" == "$description" ]]; then
            echo "GHCR description is already current."
            exit 0
          fi

          digest=$(crane digest "$IMAGE:branch-main")
          crane mutate "$IMAGE@$digest" \
            --label "org.opencontainers.image.description=$description" \
            --tag "$IMAGE:branch-main"

      - name: Remove superseded package versions when no build is using them
        if: steps.safe.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: argon-build
          KEEP_TAG: branch-main
        shell: bash
        run: |
          set -euo pipefail

          active_builds=$(gh api "repos/$GH_REPO/actions/workflows/build.yml/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if (( active_builds > 0 )); then
            echo "::notice::$active_builds Argon build(s) still active; keeping superseded image digests until the last build completes."
            exit 0
          fi

          versions="$RUNNER_TEMP/argon-package-versions.jsonl"
          gh api --paginate \
            "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            --jq '.[]' > "$versions"

          keep_id=$(
            jq -s -r --arg tag "$KEEP_TAG" '
              map(select((.metadata.container.tags // []) | index($tag)))
              | first
              | .id // empty
            ' "$versions"
          )
          [[ -n "$keep_id" ]]

          while IFS= read -r version_id; do
            [[ -z "$version_id" ]] && continue
            echo "Deleting superseded GHCR package version $version_id"
            gh api --method DELETE \
              "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
          done < <(
            jq -s -r --argjson keep "$keep_id" \
              '.[] | select(.id != $keep) | .id' "$versions"
          )
