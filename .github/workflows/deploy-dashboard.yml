name: Публикация панели Argon

on:
  push:
    branches: [dashboard]
    paths:
      - '.github/workflows/deploy-dashboard.yml'
      - 'index.html'
      - 'dashboard-data.json'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatch must not cancel the push job that requested it.
  group: argon-pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  request-deploy:
    name: Запросить публикацию панели через main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dashboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Запустить публикацию файлов dashboard в контексте main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/deploy-dashboard.yml/dispatches" -f ref=main
  deploy:
    name: Опубликовать сайт в GitHub Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Получить исходники
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: dashboard
          persist-credentials: false

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Получить данные панели из служебной ветки
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 .github/ci/update-dashboard.py --read-published

      - name: Подготовить сайт панели
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html dashboard-data.json .nojekyll _site/

      - name: Загрузить артефакт сайта
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - name: Опубликовать GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
