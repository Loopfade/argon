name: Build Argon

on:
  push:
    branches: [experimental/ca-domain-allowlist]
    # Prepared-source changes publish a new immutable image first. The later
    # digest-pin commit modifies build.yml and starts the APK build exactly once.
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arch.yml'
      - '.github/ci/run-in-build-container.sh'
  pull_request:
    # Prepared-source changes publish a new immutable image first. The later
    # digest-pin commit modifies build.yml and starts the APK build exactly once.
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arch.yml'
      - '.github/ci/run-in-build-container.sh'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label (at least 100 GiB free disk)'
        required: true
        type: string
        default: ubuntu-latest
      signing:
        description: 'Test uses a temporary certificate; release requires repository secrets'
        required: true
        type: choice
        options: [test, release]
        default: test
      arch:
        description: 'CPU: arm64 (arm64-v8a), arm (armeabi-v7a), x64 (x86_64), or x86'
        required: true
        type: choice
        options: [arm64, arm, x64, x86, all]
        default: arm64
      continuation:
        description: 'Internal automatic continuation counter'
        required: false
        type: string
        default: '0'

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: argon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # The repository cache quota is shared. Finish and package one ABI before
      # warming another so an `all` build cannot evict its own compiler cache.
      max-parallel: 1
      matrix:
        arch: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["arm64"]' || (inputs.arch == 'all' && '["arm64","arm","x64","x86"]' || format('["{0}"]', inputs.arch))) }}
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: ${{ matrix.arch }}
      image: ghcr.io/loopfade/argon-build@sha256:d8b7a4be25204388cbf3259635fed3f4d9eb94c240e09a37e3515b2ab3385cee
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      signing: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || 'test' }}
      continuation: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation || '0' }}
    secrets: inherit
