name: Build Argon

on:
  push:
    branches: [main]
    # Runtime changes can reuse a compatible prepared image.
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arch.yml'
      - '.github/ci/**'
      - 'scripts/sign_and_verify.py'
      - 'scripts/VerifyReleaseKey.java'
  pull_request:
    # PR builds use a temporary signing key and still verify prepared inputs.
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/build-arch.yml'
      - '.github/ci/**'
      - 'scripts/sign_and_verify.py'
      - 'scripts/VerifyReleaseKey.java'
  workflow_run:
    workflows: [Build prepared Chromium image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label (at least 100 GiB free disk)'
        required: true
        type: string
        default: ubuntu-24.04
      signing:
        description: 'Release uses the permanent repository key; test uses a temporary certificate'
        required: true
        type: choice
        options: [release, test]
        default: release
      arch:
        description: 'CPU: arm64 (arm64-v8a), arm (armeabi-v7a), x64 (x86_64), or x86'
        required: true
        type: choice
        options: [arm64, arm, x64, x86]
        default: arm64
      continuation:
        description: 'Internal automatic continuation counter'
        required: false
        type: string
        default: '0'
      resume_run:
        description: 'Internal run to resume after it finishes (no new build)'
        required: false
        type: string
        default: ''
      resume_attempt:
        description: 'Internal expected attempt of the run to resume'
        required: false
        type: string
        default: ''
      resume_sha:
        description: 'Internal exact checkout SHA of the run to resume'
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: read
  packages: read
  pull-requests: read

concurrency:
  # Different revisions must be able to start long enough to cancel stale work.
  # Duplicate runs of the same revision collapse to one. Resume controllers use
  # a separate group so they never cancel the build they are waiting to rerun.
  group: ${{ inputs.resume_run != '' && format('argon-resume-{0}', inputs.resume_run) || format('argon-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ inputs.resume_run == '' }}

jobs:
  supersede:
    name: Cancel stale main builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel older active Build Argon runs
        if: >-
          inputs.resume_run == '' &&
          (github.event_name == 'push' || github.event_name == 'workflow_run') &&
          github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/workflows/build.yml/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_sha, .status] | @tsv' |
          while read -r run_id head_sha status; do
            if [[ "$run_id" == "$CURRENT_RUN_ID" || "$status" == completed || "$head_sha" == "$CURRENT_SHA" ]]; then
              continue
            fi
            echo "Cancelling stale Build Argon run $run_id ($head_sha, $status)"
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" >/dev/null || true
          done

  build:
    needs: supersede
    # A workflow_run uses the default branch's current SHA. Do not release a
    # different revision, or trust a failed/untrusted prepared-image run.
    if: >-
      inputs.resume_run == '' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_sha == github.sha))
    name: Build and verify ${{ github.event_name == 'workflow_dispatch' && inputs.arch || 'arm64' }}
    # One ABI per run: the compiler-cache quota is shared by the repository.
    uses: ./.github/workflows/build-arch.yml
    with:
      arch: ${{ github.event_name == 'workflow_dispatch' && inputs.arch || 'arm64' }}
      # Resolve the latest successfully published image for the locked Chromium
      # version to an immutable digest before pulling. check-prepared-inputs.py
      # rejects it if prepared source inputs no longer match this checkout.
      image: ghcr.io/${{ github.repository_owner }}/argon-build
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
      # Trusted pushes to main use the permanent release key.
      # Pull-request builds keep their temporary key, including same-repo PRs.
      signing: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || ((github.event_name == 'push' || github.event_name == 'workflow_run') && 'release' || 'test') }}
      continuation: ${{ github.event_name == 'workflow_dispatch' && inputs.continuation || '0' }}
    secrets: inherit

  resume:
    if: github.event_name == 'workflow_dispatch' && inputs.resume_run != ''
    name: Resume the original build run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Wait for cleanup and rerun the original failed job
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_ATTEMPT: ${{ inputs.resume_attempt }}
          RESUME_SHA: ${{ inputs.resume_sha }}
          AUTO_CONTINUE_MAX: '10'
        run: python3 .github/ci/continue-build.py resume
