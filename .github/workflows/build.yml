name: Build Titanium RU arm64

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label (at least 100 GiB free disk)'
        required: true
        type: string
        default: ubuntu-latest
      signing:
        description: 'Test uses a temporary certificate; release requires repository secrets'
        required: true
        type: choice
        options: [test, release]
        default: test

permissions:
  contents: read

concurrency:
  group: titanium-ru-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Build, sign and verify APK
        env:
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ secrets.TITANIUM_RU_KEYSTORE_BASE64 }}
          TITANIUM_RU_STORE_PASSWORD: ${{ secrets.TITANIUM_RU_STORE_PASSWORD }}
          TITANIUM_RU_KEY_PASSWORD: ${{ secrets.TITANIUM_RU_KEY_PASSWORD }}
          TITANIUM_RU_KEY_ALIAS: ${{ secrets.TITANIUM_RU_KEY_ALIAS }}
        run: bash build-arm64.sh
      - name: Upload verified arm64 APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Titanium-RU-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
