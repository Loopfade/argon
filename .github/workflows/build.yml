name: Build Argon

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Linux x64 runner label (at least 100 GiB free disk)'
        required: true
        type: string
        default: ubuntu-latest
      signing:
        description: 'Test uses a temporary certificate; release requires repository secrets'
        required: true
        type: choice
        options: [test, release]
        default: test
      arch:
        description: 'CPU: arm64 (arm64-v8a), arm (armeabi-v7a), x64 (x86_64), x86, or all'
        required: true
        type: choice
        options: [arm64, arm, x64, x86, all]
        default: arm64

permissions:
  contents: read

concurrency:
  group: argon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["arm64","arm","x64","x86"]' || format('["{0}"]', inputs.arch)) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Build, sign and verify APK
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ secrets.TITANIUM_RU_KEYSTORE_BASE64 }}
          TITANIUM_RU_STORE_PASSWORD: ${{ secrets.TITANIUM_RU_STORE_PASSWORD }}
          TITANIUM_RU_KEY_PASSWORD: ${{ secrets.TITANIUM_RU_KEY_PASSWORD }}
          TITANIUM_RU_KEY_ALIAS: ${{ secrets.TITANIUM_RU_KEY_ALIAS }}
        run: bash build.sh "$TARGET_ARCH"
      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Argon-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
