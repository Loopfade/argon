name: Build prepared Chromium image

on:
  push:
    branches: [experimental/ca-domain-allowlist]
    paths:
      - '.gclient'
      - 'build-lock.json'
      - 'build.sh'
      - 'common.sh'
      - 'patch.sh'
      - 'args.gn'
      - 'chromium_overlay/**'
      - 'certificates/**'
      - 'extensions/**'
      - 'res/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vanadium'
      - 'docker/chromium/**'
      - '.github/workflows/build-chromium-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argon-chromium-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Prepare Chromium and publish OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false

      - name: Free space on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/swift
          df -h .

      - name: Select image tags
        id: image
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(python3 -c 'import json; print(json.load(open("build-lock.json"))["chromium_version"])')
          image="ghcr.io/${owner}/argon-build"
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "sha_tag=${image}:sha-${GITHUB_SHA}"
            echo "version_tag=${image}:chromium-${version}"
            echo "branch_tag=${image}:experimental"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build and publish prepared source image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: docker/chromium/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.version_tag }}
            ${{ steps.image.outputs.branch_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            ARGON_REVISION=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.branch_tag }}
          cache-to: type=inline

      - name: Publish summary
        run: |
          {
            echo '## Prepared Chromium image'
            echo
            echo '- Image: `${{ steps.image.outputs.sha_tag }}`'
            echo '- Chromium: `${{ steps.image.outputs.version }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
