name: Build prepared Chromium image

on:
  push:
    branches: [main]
    paths:
      # Changes to the image workflow itself must exercise the updated runner
      # and Docker Actions before the new configuration is considered verified.
      - '.github/workflows/build-chromium-image.yml'
      - '.github/package-metadata/argon-build-description.txt'
      - '.gclient'
      - '.dockerignore'
      - 'build-lock.json'
      - 'build.sh'
      - 'common.sh'
      - 'patch.sh'
      - 'args.gn'
      - 'chromium_overlay/**'
      - 'certificates/**'
      - 'extensions/**'
      - 'res/**'
      # Runtime signing and Python test changes do not alter prepared sources.
      - 'scripts/prepare_chromium.sh'
      - 'scripts/image_source_inputs.py'
      - '.github/ci/prune-prepared-images.py'
      - 'scripts/apply_scoped_ca.py'
      - 'scripts/fetch_pinned_extension.py'
      - 'scripts/fetch_pinned_filter_lists.py'
      - 'scripts/preflight.py'
      - 'scripts/configure_build.py'
      - 'tests/CMakeLists.txt'
      - 'tests/scoped_ca_test.cc'
      - 'vanadium'
      - 'docker/chromium/**'
  # Exercise workflow-only publishing changes explicitly with workflow_dispatch.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: argon-chromium-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # The package is a single moving main image. Manual dispatches from other
    # refs must never replace the image consumed by main/PR builds. Metadata-only
    # workflow edits may explicitly skip the expensive Chromium rebuild.
    if: >-
      github.event_name != 'workflow_run' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' ||
       !contains(github.event.head_commit.message, '[metadata-only]'))
    name: Prepare Chromium and publish OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false

      - name: Verify pinned checkout inputs
        run: python3 scripts/preflight.py --inputs-only

      - name: Free space on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/swift
          df -h .

      - name: Select image tag
        id: image
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(python3 -c 'import json; print(json.load(open("build-lock.json"))["chromium_version"])')
          image="ghcr.io/${owner}/argon-build"
          description=$(tr -d '\r\n' < .github/package-metadata/argon-build-description.txt)
          [[ -n "$description" ]]
          [[ ${#description} -le 512 ]]
          {
            echo "tag=${image}:branch-main"
            echo "version=${version}"
            echo "description=${description}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish prepared source image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/chromium/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
          annotations: |
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
          build-args: |
            ARGON_REVISION=${{ github.sha }}
          # A single-platform image without attestations is one GHCR package
          # version, so retention can safely delete every superseded version.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ steps.image.outputs.tag }}
          cache-to: type=inline

      - name: Keep only the latest successful image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: argon-build
          KEEP_TAG: branch-main
        run: python3 .github/ci/prune-prepared-images.py

      - name: Publish summary
        run: |
          {
            echo '## Prepared Chromium image'
            echo
            echo '- Image: `${{ steps.image.outputs.tag }}`'
            echo '- Chromium: `${{ steps.image.outputs.version }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
            echo '- Checks: pinned sources, patches, Python tests, C++ policy tests and GN generation.'
            echo '- Android JNI/Java compilation and APK signing are checked by Build Argon.'
          } >> "$GITHUB_STEP_SUMMARY"

  metadata:
    needs: image
    name: Update GHCR description without rebuilding Chromium
    if: >-
      always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Check whether image publication is active
        id: safe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python3 .github/ci/prune-prepared-images.py --check-publication

      - name: Log in to GitHub Container Registry
        if: steps.safe.outputs.apply == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane metadata client
        if: steps.safe.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Reconcile image description without rebuilding layers
        if: steps.safe.outputs.apply == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner=${OWNER,,}
          image="ghcr.io/${owner}/argon-build"
          description=$(tr -d '\r\n' < .github/package-metadata/argon-build-description.txt)
          [[ -n "$description" ]]
          [[ ${#description} -le 512 ]]

          current_label=$(crane config "$image:branch-main" | jq -r '.config.Labels["org.opencontainers.image.description"] // ""')
          current_annotation=$(crane manifest "$image:branch-main" | jq -r '.annotations["org.opencontainers.image.description"] // ""')
          if [[ "$current_label" == "$description" && "$current_annotation" == "$description" ]]; then
            echo "GHCR description label and manifest annotation are already current."
            exit 0
          fi

          digest=$(crane digest "$image:branch-main")
          crane mutate "$image@$digest" \
            --label "org.opencontainers.image.description=$description" \
            --annotation "org.opencontainers.image.description=$description" \
            --tag "$image:branch-main"

      - name: Remove superseded package versions when no build is using them
        if: steps.safe.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: argon-build
          KEEP_TAG: branch-main
        run: python3 .github/ci/prune-prepared-images.py
