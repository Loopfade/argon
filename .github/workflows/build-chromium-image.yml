name: Build prepared Chromium image

on:
  push:
    branches: [main]
    paths:
      # Changes to the image workflow itself must exercise the updated runner
      # and Docker Actions before the new configuration is considered verified.
      - '.github/workflows/build-chromium-image.yml'
      - '.gclient'
      - '.dockerignore'
      - 'build-lock.json'
      - 'build.sh'
      - 'common.sh'
      - 'patch.sh'
      - 'args.gn'
      - 'chromium_overlay/**'
      - 'certificates/**'
      - 'extensions/**'
      - 'res/**'
      # Runtime signing and Python test changes do not alter prepared sources.
      - 'scripts/apply_scoped_ca.py'
      - 'scripts/fetch_pinned_extension.py'
      - 'scripts/fetch_pinned_filter_lists.py'
      - 'scripts/preflight.py'
      - 'scripts/configure_build.py'
      - 'tests/CMakeLists.txt'
      - 'tests/scoped_ca_test.cc'
      - 'vanadium'
      - 'docker/chromium/**'
  # Exercise workflow-only publishing changes explicitly with workflow_dispatch
  # instead of rebuilding Chromium on every edit.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: argon-chromium-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # The package is a single moving main image. Manual dispatches from other
    # refs must never replace the image consumed by main/PR builds.
    if: github.ref == 'refs/heads/main'
    name: Prepare Chromium and publish OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false

      - name: Free space on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /opt/swift
          df -h .

      - name: Select image tag
        id: image
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          version=$(python3 -c 'import json; print(json.load(open("build-lock.json"))["chromium_version"])')
          image="ghcr.io/${owner}/argon-build"
          {
            echo "tag=${image}:branch-main"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish prepared source image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/chromium/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            ARGON_REVISION=${{ github.sha }}
          # A single-platform image without attestations is one GHCR package
          # version, so retention can safely delete every superseded version.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ steps.image.outputs.tag }}
          cache-to: type=inline

      - name: Keep only the latest successful image
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: argon-build
          KEEP_TAG: branch-main
        shell: bash
        run: |
          set -euo pipefail
          versions="$RUNNER_TEMP/argon-package-versions.jsonl"

          # This repository is user-owned. Emit one JSON object per package
          # version so all pages can be processed as a single jq stream.
          gh api --paginate             "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100"             --jq '.[]' > "$versions"

          keep_id=$(
            jq -s -r --arg tag "$KEEP_TAG" '
              map(select((.metadata.container.tags // []) | index($tag)))
              | first
              | .id // empty
            ' "$versions"
          )
          if [[ -z "$keep_id" ]]; then
            echo "::error::Published tag ${KEEP_TAG} was not found in GHCR."
            exit 1
          fi

          while IFS= read -r version_id; do
            [[ -z "$version_id" ]] && continue
            echo "Deleting superseded GHCR package version ${version_id}"
            gh api --method DELETE               "/users/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}"
          done < <(
            jq -s -r --argjson keep "$keep_id"               '.[] | select(.id != $keep) | .id' "$versions"
          )

          remaining=$(gh api             "/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100"             --jq 'length')
          if [[ "$remaining" != 1 ]]; then
            echo "::error::Expected exactly one GHCR package version, found ${remaining}."
            exit 1
          fi

      - name: Publish summary
        run: |
          {
            echo '## Prepared Chromium image'
            echo
            echo '- Image: `${{ steps.image.outputs.tag }}`'
            echo '- Chromium: `${{ steps.image.outputs.version }}`'
            echo '- Digest: `${{ steps.build.outputs.digest }}`'
            echo '- Checks: pinned sources, patches, Python tests, C++ policy tests and GN generation.'
            echo '- Android JNI/Java compilation and APK signing are checked by Build Argon.'
          } >> "$GITHUB_STEP_SUMMARY"
