name: Transfer compiler cache

on:
  pull_request:
    paths: ['.github/workflows/transfer-compiler-cache.yml']
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: Export from the selected source branch, then import on main
        type: choice
        options: [export, import]
        default: export
      source_run:
        description: Successful export run ID (required for import)
        type: string
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      CCACHE_CACHE_PREFIX: argon-ccache-v2-arm64
      TRANSFER_MODE: ${{ github.event_name == 'pull_request' && 'export' || inputs.mode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore source cache
        if: env.TRANSFER_MODE == 'export'
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: argon-ccache-v2-arm64-transfer-${{ github.run_id }}
          restore-keys: argon-ccache-v2-arm64-
          fail-on-cache-miss: true
      - name: Archive source cache
        if: env.TRANSFER_MODE == 'export'
        env:
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: |
          test -n "$MATCHED_KEY"
          mkdir -p "$RUNNER_TEMP/cache-transfer"
          tar --zstd -cf "$RUNNER_TEMP/cache-transfer/ccache.tar.zst" -C "$RUNNER_TEMP/ccache" .
          cd "$RUNNER_TEMP/cache-transfer"
          sha256sum ccache.tar.zst > ccache.tar.zst.sha256
          printf 'Source: %s\nRef: %s\nCache: %s\n' "$GITHUB_SHA" "$GITHUB_REF" "$MATCHED_KEY" > provenance.txt
          cat provenance.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish transferable cache
        if: env.TRANSFER_MODE == 'export'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: argon-ccache-arm64
          path: ${{ runner.temp }}/cache-transfer/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Download verified export
        if: env.TRANSFER_MODE == 'import'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          assert run['path'] == '.github/workflows/transfer-compiler-cache.yml'
          assert run['event'] in ('workflow_dispatch', 'pull_request') and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          if run['event'] == 'pull_request':
              # Import a PR's cache only after its code has been merged into
              # this main checkout. Never promote an unmerged/fork PR cache.
              comparison = json.loads(subprocess.check_output([
                  'gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/compare/{run['head_sha']}...{os.environ['GITHUB_SHA']}"
              ], text=True))
              assert comparison['status'] in ('ahead', 'identical'), 'PR commit is not merged into this main checkout'
          PY
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name argon-ccache-arm64 --dir "$RUNNER_TEMP/cache-transfer"
          cd "$RUNNER_TEMP/cache-transfer"
          sha256sum -c ccache.tar.zst.sha256
          mkdir -p "$RUNNER_TEMP/ccache"
          tar --zstd -xf ccache.tar.zst -C "$RUNNER_TEMP/ccache"
          cat provenance.txt >> "$GITHUB_STEP_SUMMARY"
          du -sh "$RUNNER_TEMP/ccache" >> "$GITHUB_STEP_SUMMARY"
      - name: Save cache in main branch scope
        if: env.TRANSFER_MODE == 'import'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: argon-ccache-v2-arm64-${{ github.sha }}-import-${{ github.run_id }}
      - name: Remove superseded main snapshots after verified import
        if: env.TRANSFER_MODE == 'import'
        env:
          REPLACEMENT_KEY: argon-ccache-v2-arm64-${{ github.sha }}-import-${{ github.run_id }}
        run: python3 .github/ci/prune-compiler-cache.py "$REPLACEMENT_KEY"
