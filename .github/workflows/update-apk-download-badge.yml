name: Update APK download badge

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  release:
    types: [published, unpublished, deleted]

permissions:
  contents: write

concurrency:
  group: update-apk-download-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BADGE_BRANCH: badges
      BADGE_PATH: badges/apk-downloads.json
    steps:
      - name: Sum public APK downloads and update badge data
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com"
          total=0
          page=1

          while :; do
            releases="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/repos/${REPOSITORY}/releases?per_page=100&page=${page}")"

            count="$(jq 'length' <<<"${releases}")"
            page_total="$(jq '[.[] | select(.draft == false) | .assets[]? | select(.name | ascii_downcase | endswith(".apk")) | .download_count] | add // 0' <<<"${releases}")"
            total=$((total + page_total))

            if (( count < 100 )); then
              break
            fi
            page=$((page + 1))
          done

          badge="$(jq -cn --arg message "${total}" '{schemaVersion: 1, label: "Скачивания APK", message: $message, color: "blue"}')"

          existing="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/repos/${REPOSITORY}/contents/${BADGE_PATH}?ref=${BADGE_BRANCH}")"

          current="$(jq -r '.content' <<<"${existing}" | tr -d '\n' | base64 --decode)"
          if [[ "${current}" == "${badge}" ]]; then
            echo "APK download count is unchanged: ${total}"
            exit 0
          fi

          content="$(printf '%s\n' "${badge}" | base64 -w0)"
          sha="$(jq -r '.sha' <<<"${existing}")"
          payload="$(jq -cn \
            --arg message "chore: refresh APK download badge" \
            --arg content "${content}" \
            --arg branch "${BADGE_BRANCH}" \
            --arg sha "${sha}" \
            '{message: $message, content: $content, branch: $branch, sha: $sha}')"

          curl --fail-with-body --silent --show-error --retry 3 \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${api}/repos/${REPOSITORY}/contents/${BADGE_PATH}" \
            --data-binary "${payload}" >/dev/null

          echo "Updated APK download count: ${total}"
