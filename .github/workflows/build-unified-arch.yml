name: Build one architecture continuously

on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      image:
        type: string
        required: true
      runner:
        type: string
        required: true
      signing:
        type: string
        required: true
      fingerprint:
        type: string
        required: true
      certificate:
        type: string
        required: true
      auto_continue:
        type: boolean
        default: true
    secrets:
      TITANIUM_RU_KEYSTORE_BASE64:
        required: false
      TITANIUM_RU_STORE_PASSWORD:
        required: false
      TITANIUM_RU_KEY_PASSWORD:
        required: false
      TITANIUM_RU_KEY_ALIAS:
        required: false

permissions:
  actions: write
  contents: read
  packages: read
  pull-requests: read

env:
  CCACHE_MAXSIZE: 7G
  BUILD_JOB_BUDGET_SECONDS: 21600
  BUILD_FINALIZE_RESERVE_SECONDS: 1800
  BUILD_CONTAINER_NAME: argon-build
  AUTO_CONTINUE_MAX: 10
  TARGET_ARCH: ${{ inputs.arch }}

jobs:
  build:
    name: Build, sign and verify APK (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Record budget and separate live cache from saved snapshots
        run: |
          echo "BUILD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_LIVE_DIR=$RUNNER_TEMP/ccache-live" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Select Chromium-version and architecture cache namespace
        run: |
          prefix=$(python3 .github/ci/prune-compiler-cache.py --prefix-for "$TARGET_ARCH")
          echo "CCACHE_CACHE_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Start the exact prepared image selected by the pipeline
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREPARED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/argon-build@sha256:[a-f0-9]{64}$ ]]
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          python3 .github/ci/pull-prepared-image.py "$PREPARED_IMAGE"
          mkdir -p "$CCACHE_DIR" "$CCACHE_LIVE_DIR"
          ln -s /opt/argon/chromium chromium
          ln -s /opt/argon/depot_tools depot_tools
          docker create --name "$BUILD_CONTAINER_NAME" --user 0 --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" --volume "$CCACHE_LIVE_DIR:/ccache" \
            "$PREPARED_IMAGE" sleep infinity
          docker start "$BUILD_CONTAINER_NAME"
          docker exec "$BUILD_CONTAINER_NAME" git config --global --add safe.directory '*'
      - name: Verify prepared sources and pinned signing tools
        env:
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: |
          docker exec "$BUILD_CONTAINER_NAME" python3 /workspace/.github/ci/check-prepared-inputs.py \
            --prepared /opt/argon --checkout /workspace
          docker exec --env TITANIUM_RU_KEYSTORE_BASE64 --env TITANIUM_RU_STORE_PASSWORD \
            --env TITANIUM_RU_KEY_PASSWORD --env TITANIUM_RU_KEY_ALIAS \
            "$BUILD_CONTAINER_NAME" python3 /workspace/scripts/sign_and_verify.py \
            --check-tools --mode "$SIGNING_MODE" \
            --sdk /opt/argon/chromium/src/third_party/android_sdk/public \
            --jdk /opt/argon/chromium/src/third_party/jdk/current
      - name: Remove caches from older Chromium versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/prune-compiler-cache.py --remove-old-versions "$TARGET_ARCH"
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continuous-final
          restore-keys: |
            ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ env.CCACHE_CACHE_PREFIX }}-
      - name: Seed the live cache and reset statistics
        run: |
          python3 .github/ci/continuous-build.py snapshot --source "$CCACHE_DIR" --destination "$CCACHE_LIVE_DIR"
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --zero-stats
      - name: Start one uninterrupted APK build
        id: start
        env:
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: python3 .github/ci/continuous-build.py start
      # Six hourly waits cover the six-hour job budget. They observe the same
      # Ninja process and stop as soon as it finishes; they never restart it.
      - name: Preserve progress after up to one hour
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        continue-on-error: true
        uses: ./.github/actions/compiler-checkpoint
        with:
          number: '1'
      - name: Preserve progress after up to two hours
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        continue-on-error: true
        uses: ./.github/actions/compiler-checkpoint
        with:
          number: '2'
      - name: Preserve progress after up to three hours
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        continue-on-error: true
        uses: ./.github/actions/compiler-checkpoint
        with:
          number: '3'
      - name: Preserve progress after up to four hours
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        continue-on-error: true
        uses: ./.github/actions/compiler-checkpoint
        with:
          number: '4'
      - name: Preserve progress after up to five hours
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        continue-on-error: true
        uses: ./.github/actions/compiler-checkpoint
        with:
          number: '5'
      - name: Wait for the controlled build deadline
        if: hashFiles(format('.build/continuous-{0}.json', inputs.arch)) == ''
        run: python3 .github/ci/continuous-build.py wait --minutes 60
      - name: Collect actual build result
        id: build
        continue-on-error: true
        run: python3 .github/ci/continuous-build.py finish
      - name: Bind verified APK to this pipeline plan
        id: provenance
        if: steps.build.outcome == 'success'
        env:
          BUILD_FINGERPRINT: ${{ inputs.fingerprint }}
          BUILD_CERTIFICATE: ${{ inputs.certificate }}
          PREPARED_IMAGE: ${{ inputs.image }}
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          # Signing created these files as the container user; record provenance
          # there too, with the exact source SHA from this workflow run.
          docker exec --env GITHUB_SHA "$BUILD_CONTAINER_NAME" \
            python3 /workspace/.github/ci/full-build.py record --arch "$TARGET_ARCH" --mode "$SIGNING_MODE" \
            --fingerprint "$BUILD_FINGERPRINT" --certificate "$BUILD_CERTIFICATE" --image "$PREPARED_IMAGE"
      - name: Show cache statistics and stop compiler processes
        if: always()
        run: |
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --show-stats || true
          docker rm --force "$BUILD_CONTAINER_NAME" || true
      - name: Snapshot final compiler progress
        id: final_snapshot
        if: always() && steps.cache.outcome == 'success'
        run: python3 .github/ci/continuous-build.py snapshot --source "$CCACHE_LIVE_DIR" --destination "$CCACHE_DIR"
      - name: Save compiler cache
        id: save_final_cache
        if: always() && steps.final_snapshot.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Confirm saved progress before dropping older snapshots
        id: confirmed_cache
        if: always() && !cancelled() && steps.save_final_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: python3 .github/ci/prune-compiler-cache.py "$CURRENT_CACHE_KEY"
      - name: Upload verified APK and provenance
        if: steps.build.outcome == 'success' && steps.provenance.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Argon-${{ inputs.arch }}-${{ github.sha }}-${{ inputs.fingerprint }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Record eligibility for automatic continuation
        id: continuation_marker
        if: >-
          always() && !cancelled() && inputs.auto_continue && steps.build.outcome == 'failure' &&
          steps.save_final_cache.outcome == 'success' && steps.confirmed_cache.outputs.verified == 'true' &&
          hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argon-continuation-${{ github.run_attempt }}-${{ inputs.arch }}
          path: .build/cache-warm-budget-exhausted-${{ inputs.arch }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
      - name: Continue this same manual cycle after a saved-cache timeout
        if: always() && !cancelled() && steps.continuation_marker.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_COUNT: '0'
        run: python3 .github/ci/continue-build.py schedule
      - name: Summarize architecture result
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          PROVENANCE_RESULT: ${{ steps.provenance.outcome }}
          RESTORED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          {
            echo "## $TARGET_ARCH continuous build"
            echo "- Build: $BUILD_RESULT; provenance: $PROVENANCE_RESULT"
            echo "- Restored cache: ${RESTORED_KEY:-none; cold build}"
            echo '- One Ninja process; periodic snapshots do not interrupt Java or linking.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail incomplete or unverified builds
        if: always() && !cancelled() && (steps.build.outcome != 'success' || steps.provenance.outcome != 'success')
        run: exit 1
