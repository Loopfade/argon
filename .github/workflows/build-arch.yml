      - name: Build, sign and verify APK
        id: build
        # Even if a slice interrupted linking, give the APK target a continuous
        # final window. Only the compiler cache survives on the next runner.
        if: success()
        continue-on-error: true
        env:
          BUILD_MODE: finish
          SIGNING_MODE: ${{ inputs.signing }}
          TARGET_ARCH: ${{ inputs.arch }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_JOB_STARTED_AT ))
          remaining=$(( BUILD_JOB_BUDGET_SECONDS - BUILD_FINALIZE_RESERVE_SECONDS - elapsed ))
          if (( remaining < 60 )); then
            echo "::notice::No build time remains after reserving ${BUILD_FINALIZE_RESERVE_SECONDS}s for cache and artifact upload."
            mkdir -p .build
            touch ".build/cache-warm-budget-exhausted-${TARGET_ARCH}"
            exit 124
          fi
          echo "Final build time budget: ${remaining}s (elapsed: ${elapsed}s, finalize reserve: ${BUILD_FINALIZE_RESERVE_SECONDS}s)"
          build_started_at=$(date +%s)
          set +e
          BUILD_EXEC_TIMEOUT_SECONDS="$remaining" BUILD_JOBS="$(nproc)" \
            bash .github/ci/run-in-build-container.sh
          build_status=$?
          set -e
          build_elapsed=$(( $(date +%s) - build_started_at ))
          if (( build_status == 124 || (build_status == 137 && build_elapsed >= remaining) )); then
            echo "::notice::Final build exhausted its time budget; continuing on a fresh runner."
            mkdir -p .build
            touch ".build/cache-warm-budget-exhausted-${TARGET_ARCH}"
          elif (( build_status == 137 )); then
            echo '::error::Build killed before its time limit (possible OOM); automatic retry is disabled.'
          fi
          exit "$build_status"
      - name: Show local compiler-cache statistics
        if: always()
        run: |
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --show-stats || true
          du -sh "$CCACHE_DIR" 2>/dev/null || true
          df -h .
      - name: Stop prepared build container
        if: always()
        run: docker rm --force "$BUILD_CONTAINER_NAME" || true
      - name: Upload verified APK and provenance
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Argon-${{ inputs.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Save compiler cache
        id: save_final_cache
        if: always() && steps.cache.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Drop older compiler caches after verified final save
        if: always() && !cancelled() && steps.save_final_cache.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: python3 .github/ci/prune-compiler-cache.py "$CURRENT_CACHE_KEY"
      - name: Continue cache warm-up on a fresh runner
        id: continue_build
        if: always() && !cancelled() && steps.build.outcome != 'success' && hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION_COUNT: ${{ inputs.continuation }}
          RUNNER_LABEL: ${{ inputs.runner }}
          SIGNING_MODE: ${{ inputs.signing }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          if [[ ! "$CONTINUATION_COUNT" =~ ^(0|[1-9][0-9]?)$ ]]; then
            echo '::error::Invalid automatic continuation counter.'
            exit 1
          fi
          if (( CONTINUATION_COUNT >= AUTO_CONTINUE_MAX )); then
            echo "::error::Automatic continuation limit (${AUTO_CONTINUE_MAX}) reached."
            exit 1
          fi
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$branch_sha" != "$GITHUB_SHA" ]]; then
            echo '::error::Branch changed during this run; refusing to restart a different commit.'
            exit 1
          fi
          next=$(( CONTINUATION_COUNT + 1 ))
          echo "Starting automatic continuation ${next}/${AUTO_CONTINUE_MAX} for ${TARGET_ARCH}."
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f runner="$RUNNER_LABEL" \
            -f signing="$SIGNING_MODE" \
            -f arch="$TARGET_ARCH" \
            -f continuation="$next"
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"
      - name: Fail after preserving diagnostics
        if: always() && !cancelled() && steps.build.outcome != 'success' && steps.continue_build.outcome != 'success'
        run: exit 1
