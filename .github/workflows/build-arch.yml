      - name: Save compiler cache checkpoint 4
        id: save_checkpoint_4
        if: always() && steps.checkpoint_4.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
