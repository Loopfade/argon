name: Build one Argon architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      signing:
        required: true
        type: string
    secrets:
      TITANIUM_RU_KEYSTORE_BASE64:
        required: false
      TITANIUM_RU_STORE_PASSWORD:
        required: false
      TITANIUM_RU_KEY_PASSWORD:
        required: false
      TITANIUM_RU_KEY_ALIAS:
        required: false

permissions:
  actions: write
  contents: read

env:
  CACHE_PREFIX: argon-ccache-v1-${{ inputs.arch }}-${{ github.sha }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 7G

jobs:
  warm-1:
    name: Warm compiler cache 1/2 (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-warm-1
          restore-keys: |
            argon-ccache-v1-${{ inputs.arch }}-
      - name: Warm compiler cache for four hours
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: warm
          BUILD_TIME_LIMIT_MINUTES: 240
          TARGET_ARCH: ${{ inputs.arch }}
        run: bash build.sh "$TARGET_ARCH"
      - name: Save compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-warm-1

  warm-2:
    name: Warm compiler cache 2/2 (${{ inputs.arch }})
    needs: warm-1
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-warm-2
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-warm-1
      - name: Continue warming compiler cache for four hours
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUILD_MODE: warm
          BUILD_TIME_LIMIT_MINUTES: 240
          TARGET_ARCH: ${{ inputs.arch }}
        run: bash build.sh "$TARGET_ARCH"
      - name: Save expanded compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-warm-2

  package:
    name: Link, sign and verify APK (${{ inputs.arch }})
    needs: warm-2
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore warmed compiler cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-warm-2
          fail-on-cache-miss: true
      - name: Build, sign and verify APK
        env:
          BUILD_MODE: apk
          SIGNING_MODE: ${{ inputs.signing }}
          TARGET_ARCH: ${{ inputs.arch }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: bash build.sh "$TARGET_ARCH"
      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Argon-${{ inputs.arch }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove superseded warm-up cache
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "${CACHE_PREFIX}-warm-1" --repo "$GITHUB_REPOSITORY" || true
