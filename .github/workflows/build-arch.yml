        if: always() && steps.checkpoint_9.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-9
      - name: Drop cache superseded by checkpoint 9
        if: steps.save_checkpoint_9.outcome == 'success'
        continue-on-error: true
