      - name: Warm local compiler cache (checkpoint 8/12)
        id: checkpoint_8
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true' && steps.checkpoint_3.outputs.complete != 'true' && steps.checkpoint_4.outputs.complete != 'true' && steps.checkpoint_5.outputs.complete != 'true' && steps.checkpoint_6.outputs.complete != 'true' && steps.checkpoint_7.outputs.complete != 'true'
