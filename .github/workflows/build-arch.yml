      - name: Save compiler cache checkpoint 3
        id: save_checkpoint_3
        if: always() && steps.checkpoint_3.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
