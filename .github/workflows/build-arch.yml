      - name: Save compiler cache checkpoint 6
        id: save_checkpoint_6
        if: always() && steps.checkpoint_6.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
