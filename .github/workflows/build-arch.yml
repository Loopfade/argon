name: Build one Argon architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image:
        required: true
        type: string
      runner:
        required: true
        type: string
      signing:
        required: true
        type: string
      continuation:
        required: false
        type: string
        default: '0'
    secrets:
      TITANIUM_RU_KEYSTORE_BASE64:
        required: false
      TITANIUM_RU_STORE_PASSWORD:
        required: false
      TITANIUM_RU_KEY_PASSWORD:
        required: false
      TITANIUM_RU_KEY_ALIAS:
        required: false

permissions:
  actions: write
  contents: read
  packages: read

env:
  CCACHE_CACHE_PREFIX: argon-ccache-v2-${{ inputs.arch }}
  CCACHE_MAXSIZE: 7G
  BUILD_JOB_BUDGET_SECONDS: 21600
  BUILD_FINALIZE_RESERVE_SECONDS: 1800
  BUILD_FINISH_MINIMUM_SECONDS: 3600
  BUILD_CHECKPOINT_MINUTES: 20
  AUTO_CONTINUE_MAX: 10
  BUILD_CONTAINER_NAME: argon-build

jobs:
  build:
    name: Build, sign and verify APK (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Record job start time and cache location
        run: |
          echo "BUILD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-
            argon-ccache-v2-${{ inputs.arch }}-
      - name: Start prepared Argon build container
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREPARED_IMAGE: ${{ inputs.image }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$PREPARED_IMAGE"
          mkdir -p "$CCACHE_DIR"
          ln -s /opt/argon/chromium chromium
          ln -s /opt/argon/depot_tools depot_tools
          docker create \
            --name "$BUILD_CONTAINER_NAME" \
            --user 0 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$CCACHE_DIR:/ccache" \
            "$PREPARED_IMAGE" sleep infinity
          docker start "$BUILD_CONTAINER_NAME"
          docker exec "$BUILD_CONTAINER_NAME" git config --global --add safe.directory '*'
          docker exec "$BUILD_CONTAINER_NAME" test -d /opt/argon/chromium/src
          df -h .
      - name: Verify prepared sources and signing tools before warm-up
        env:
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: |
          if [[ "$SIGNING_MODE" == release ]]; then
            : "${TITANIUM_RU_KEYSTORE_BASE64:?Missing release keystore}"
            : "${TITANIUM_RU_STORE_PASSWORD:?Missing release store password}"
            : "${TITANIUM_RU_KEY_PASSWORD:?Missing release key password}"
            : "${TITANIUM_RU_KEY_ALIAS:?Missing release alias}"
          fi
          docker exec "$BUILD_CONTAINER_NAME" python3 /workspace/.github/ci/check-prepared-inputs.py \
            --prepared /opt/argon --checkout /workspace
          docker exec "$BUILD_CONTAINER_NAME" python3 /workspace/scripts/sign_and_verify.py \
            --check-tools --sdk /opt/argon/chromium/src/third_party/android_sdk/public \
            --jdk /opt/argon/chromium/src/third_party/jdk/current
      - name: Reset compiler-cache statistics
        run: docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --zero-stats
      - name: Warm local compiler cache (checkpoint 1/20)
        id: checkpoint_1
        if: hashFiles(format('.build/cache-warm-complete-{0}', inputs.arch)) == '' && hashFiles(format('.build/cache-warm-slices-exhausted-{0}', inputs.arch)) == ''
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: bash .github/ci/warm-compiler-cache.sh
      - name: Save compiler cache checkpoint 1
        id: save_checkpoint_1
        if: always() && steps.checkpoint_1.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1
      - name: Drop cache superseded by checkpoint 1
        if: always() && !cancelled() && steps.save_checkpoint_1.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1
        run: python3 .github/ci/prune-compiler-cache.py "$CURRENT_CACHE_KEY"
