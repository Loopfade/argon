name: Build one Argon architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image:
        required: true
        type: string
      runner:
        required: true
        type: string
      signing:
        required: true
        type: string
      continuation:
        required: false
        type: number
        default: 0
    secrets:
      TITANIUM_RU_KEYSTORE_BASE64:
        required: false
      TITANIUM_RU_STORE_PASSWORD:
        required: false
      TITANIUM_RU_KEY_PASSWORD:
        required: false
      TITANIUM_RU_KEY_ALIAS:
        required: false

permissions:
  actions: write
  contents: read
  packages: read

env:
  CCACHE_CACHE_PREFIX: argon-ccache-v2-${{ inputs.arch }}
  CCACHE_MAXSIZE: 7G
  BUILD_JOB_BUDGET_SECONDS: 21600
  BUILD_FINALIZE_RESERVE_SECONDS: 1800
  BUILD_FINISH_MINIMUM_SECONDS: 3600
  BUILD_CHECKPOINT_MINUTES: 20
  AUTO_CONTINUE_MAX: 10
  BUILD_CONTAINER_NAME: argon-build

jobs:
  build:
    name: Build, sign and verify APK (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Record job start time and cache location
        run: |
          echo "BUILD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-
            argon-ccache-v2-${{ inputs.arch }}-
      - name: Start prepared Argon build container
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREPARED_IMAGE: ${{ inputs.image }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$PREPARED_IMAGE"
          mkdir -p "$CCACHE_DIR"
          ln -s /opt/argon/chromium chromium
          ln -s /opt/argon/depot_tools depot_tools
          docker create \
            --name "$BUILD_CONTAINER_NAME" \
            --user 0 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$CCACHE_DIR:/ccache" \
            "$PREPARED_IMAGE" sleep infinity
          docker start "$BUILD_CONTAINER_NAME"
          docker exec "$BUILD_CONTAINER_NAME" git config --global --add safe.directory '*'
          docker exec "$BUILD_CONTAINER_NAME" test -d /opt/argon/chromium/src
          df -h .
      - name: Reset compiler-cache statistics
        run: docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --zero-stats
      - name: Warm local compiler cache (checkpoint 1/20)
        id: checkpoint_1
        if: hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) == ''
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_JOB_STARTED_AT ))
          remaining=$(( BUILD_JOB_BUDGET_SECONDS - elapsed ))
          required=$(( BUILD_CHECKPOINT_MINUTES * 60 + BUILD_FINALIZE_RESERVE_SECONDS ))
          if (( remaining < required )); then
            echo "::notice::Deferring the next cache slice: ${remaining}s remain, ${required}s are required."
            mkdir -p .build
            touch ".build/cache-warm-budget-exhausted-${TARGET_ARCH}"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'budget_exhausted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          echo 'budget_exhausted=false' >> "$GITHUB_OUTPUT"
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save compiler cache checkpoint 1
        id: save_checkpoint_1
        if: always() && steps.checkpoint_1.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1
      - name: Drop stale compiler caches after checkpoint 1
        if: steps.save_checkpoint_1.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1
        run: |
          gh cache list --ref "$GITHUB_REF" --limit 100 --json id,key \
            --jq ".[] | select(.key | startswith(\"${CCACHE_CACHE_PREFIX}-\")) | select(.key != \"${CURRENT_CACHE_KEY}\") | .id" |
          while read -r cache_id; do
            [[ -z "$cache_id" ]] || gh cache delete "$cache_id"
          done
      - name: Warm local compiler cache (checkpoint 2/20)
        id: checkpoint_2
        if: steps.checkpoint_1.outputs.complete != 'true' && hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) == ''
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_JOB_STARTED_AT ))
          remaining=$(( BUILD_JOB_BUDGET_SECONDS - elapsed ))
          required=$(( BUILD_CHECKPOINT_MINUTES * 60 + BUILD_FINALIZE_RESERVE_SECONDS ))
          if (( remaining < required )); then
            echo "::notice::Deferring the next cache slice: ${remaining}s remain, ${required}s are required."
            mkdir -p .build
            touch ".build/cache-warm-budget-exhausted-${TARGET_ARCH}"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'budget_exhausted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          echo 'budget_exhausted=false' >> "$GITHUB_OUTPUT"
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save compiler cache checkpoint 2
        id: save_checkpoint_2
        if: always() && steps.checkpoint_2.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-2
      - name: Drop cache superseded by checkpoint 2
        if: steps.save_checkpoint_2.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1" --ref "$GITHUB_REF"
      - name: Warm local compiler cache (checkpoint 3/20)
        id: checkpoint_3
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true' && hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) == ''
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_JOB_STARTED_AT ))
          remaining=$(( BUILD_JOB_BUDGET_SECONDS - elapsed ))
          required=$(( BUILD_CHECKPOINT_MINUTES * 60 + BUILD_FINALIZE_RESERVE_SECONDS ))
          if (( remaining < required )); then
            echo "::notice::Deferring the next cache slice: ${remaining}s remain, ${required}s are required."
            mkdir -p .build
            touch ".build/cache-warm-budget-exhausted-${TARGET_ARCH}"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'budget_exhausted=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          echo 'budget_exhausted=false' >> "$GITHUB_OUTPUT"
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save compiler cache checkpoint 3
        id: save_checkpoint_3
        if: always() && steps.checkpoint_3.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-3
      - name: Drop cache superseded by checkpoint 3
        if: steps.save_checkpoint_3.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-2" --ref "$GITHUB_REF"
      - name: Warm local compiler cache (checkpoint 4/20)
        id: checkpoint_4
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true' && steps.checkpoint_3.outputs.complete != 'true' && hashFiles(format('.build/cache-warm-budget-exhausted-{0}', inputs.arch)) == ''
        env:
