name: Build one Argon architecture

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      image:
        required: true
        type: string
      runner:
        required: true
        type: string
      signing:
        required: true
        type: string
    secrets:
      TITANIUM_RU_KEYSTORE_BASE64:
        required: false
      TITANIUM_RU_STORE_PASSWORD:
        required: false
      TITANIUM_RU_KEY_PASSWORD:
        required: false
      TITANIUM_RU_KEY_ALIAS:
        required: false

permissions:
  actions: write
  contents: read
  packages: read

env:
  CCACHE_CACHE_PREFIX: argon-ccache-v2-${{ inputs.arch }}
  CCACHE_MAXSIZE: 7G
  BUILD_JOB_BUDGET_SECONDS: 21600
  BUILD_FINALIZE_RESERVE_SECONDS: 1800
  BUILD_CHECKPOINT_MINUTES: 20
  BUILD_CONTAINER_NAME: argon-build

jobs:
  build:
    name: Build, sign and verify APK (${{ inputs.arch }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - name: Record job start time and cache location
        run: |
          echo "BUILD_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Free space on disposable GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Restore compiler cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-
            argon-ccache-v2-${{ inputs.arch }}-
      - name: Start prepared Argon build container
        env:
          GHCR_TOKEN: ${{ github.token }}
          PREPARED_IMAGE: ${{ inputs.image }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$PREPARED_IMAGE"
          mkdir -p "$CCACHE_DIR"
          ln -s /opt/argon/chromium chromium
          ln -s /opt/argon/depot_tools depot_tools
          docker create \
            --name "$BUILD_CONTAINER_NAME" \
            --user 0 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$CCACHE_DIR:/ccache" \
            "$PREPARED_IMAGE" sleep infinity
          docker start "$BUILD_CONTAINER_NAME"
          docker exec "$BUILD_CONTAINER_NAME" git config --global --add safe.directory '*'
          docker exec "$BUILD_CONTAINER_NAME" test -d /opt/argon/chromium/src
          df -h .
      - name: Reset compiler-cache statistics
        run: docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --zero-stats
      - name: Warm local compiler cache (checkpoint 1/12)
        id: checkpoint_1
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save compiler cache checkpoint 1
        id: save_checkpoint_1
        if: always() && steps.checkpoint_1.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1
      - name: Drop cache superseded by checkpoint 1
        if: steps.save_checkpoint_1.outcome == 'success' && steps.cache.outputs.cache-matched-key != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORED_CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: gh cache delete "$RESTORED_CACHE_KEY" --ref "$GITHUB_REF"
      - name: Warm local compiler cache (checkpoint 2/12)
        id: checkpoint_2
        if: steps.checkpoint_1.outputs.complete != 'true'
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Save compiler cache checkpoint 2
        id: save_checkpoint_2
        if: always() && steps.checkpoint_2.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-2
      - name: Drop cache superseded by checkpoint 2
        if: steps.save_checkpoint_2.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "${{ env.CCACHE_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-checkpoint-1" --ref "$GITHUB_REF"
      - name: Warm local compiler cache (checkpoint 3/12)
        id: checkpoint_3
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true'
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
          if [[ -f ".build/cache-warm-complete-${TARGET_ARCH}" ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
