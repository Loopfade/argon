      - name: Warm local compiler cache (checkpoint 10/12)
        id: checkpoint_10
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true' && steps.checkpoint_3.outputs.complete != 'true' && steps.checkpoint_4.outputs.complete != 'true' && steps.checkpoint_5.outputs.complete != 'true' && steps.checkpoint_6.outputs.complete != 'true' && steps.checkpoint_7.outputs.complete != 'true' && steps.checkpoint_8.outputs.complete != 'true' && steps.checkpoint_9.outputs.complete != 'true'
        env:
          BUILD_MODE: checkpoint
          BUILD_TIME_LIMIT_MINUTES: ${{ env.BUILD_CHECKPOINT_MINUTES }}
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          env BUILD_JOBS="$(nproc)" bash .github/ci/run-in-build-container.sh
          docker exec --env CCACHE_DIR=/ccache "$BUILD_CONTAINER_NAME" ccache --cleanup || true
