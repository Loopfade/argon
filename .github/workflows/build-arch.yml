      - name: Warm local compiler cache (checkpoint 5/12)
        id: checkpoint_5
        if: steps.checkpoint_1.outputs.complete != 'true' && steps.checkpoint_2.outputs.complete != 'true' && steps.checkpoint_3.outputs.complete != 'true' && steps.checkpoint_4.outputs.complete != 'true'
        env:
