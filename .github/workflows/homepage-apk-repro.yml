name: Проверить домашнюю страницу в готовом ARM APK
on:
  push:
    branches: [codex/homepage-apk-repro]
    paths:
      - '.github/workflows/homepage-apk-repro.yml'
      - 'tests/android/homepage_apk_repro.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Получить проверенный ARM64 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .apk-input android-repro
          gh api repos/Loopfade/argon/actions/artifacts/13048211687/zip > "$RUNNER_TEMP/argon-apk.zip"
          unzip -q "$RUNNER_TEMP/argon-apk.zip" -d .apk-input
          python3 -m venv "$RUNNER_TEMP/argon-ui-venv"
          "$RUNNER_TEMP/argon-ui-venv/bin/pip" install --disable-pip-version-check 'androguard==4.1.3' 'frida==16.7.19'
          curl --fail --location --retry 3 https://github.com/frida/frida/releases/download/16.7.19/frida-server-16.7.19-android-x86_64.xz -o "$RUNNER_TEMP/frida-server.xz"
          xz -d "$RUNNER_TEMP/frida-server.xz"
          chmod +x "$RUNNER_TEMP/frida-server"
      - name: Разрешить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запустить настоящий APK в Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: $RUNNER_TEMP/argon-ui-venv/bin/python tests/android/homepage_apk_repro.py
      - name: Сохранить экраны и состояние панели
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-homepage-repro
          path: android-repro/
          if-no-files-found: error
          retention-days: 7
