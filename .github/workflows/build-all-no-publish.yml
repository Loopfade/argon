name: Build Argon (artifacts only)
run-name: Full Argon build without APK publishing (${{ inputs.signing }})

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'release uses the permanent key; test uses a temporary key; APKs stay in run artifacts'
        type: choice
        options: [release, test]
        default: release
        required: true
      runner:
        description: 'Linux x64 build runner with at least 100 GiB free disk'
        type: string
        default: ubuntu-24.04
        required: true
      auto_continue:
        description: 'Continue the same commit after a saved-cache build timeout'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write
  packages: write
  pull-requests: read

concurrency:
  group: argon-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Check inputs and reuse verified APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      build: ${{ steps.plan.outputs.build }}
      matrix: ${{ steps.plan.outputs.matrix }}
      certificate: ${{ steps.plan.outputs.certificate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Verify pinned inputs for both architectures
        run: |
          python3 scripts/preflight.py --inputs-only --arch arm64
          python3 scripts/preflight.py --inputs-only --arch arm
      - name: Plan required work and verify reusable APKs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ inputs.signing }}
          TITANIUM_RU_KEYSTORE_BASE64: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEYSTORE_BASE64 || '' }}
          TITANIUM_RU_STORE_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_STORE_PASSWORD || '' }}
          TITANIUM_RU_KEY_PASSWORD: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_PASSWORD || '' }}
          TITANIUM_RU_KEY_ALIAS: ${{ inputs.signing == 'release' && secrets.TITANIUM_RU_KEY_ALIAS || '' }}
        run: python3 .github/ci/full-build.py plan --mode "$SIGNING_MODE"
      - name: Attach reused arm64 APK to this run
        if: steps.plan.outputs.reuse_arm64 == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Argon-arm64-${{ github.sha }}-${{ steps.plan.outputs.fingerprint_arm64 }}
          path: artifacts/arm64-v8a/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Attach reused arm APK to this run
        if: steps.plan.outputs.reuse_arm == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Argon-arm-${{ github.sha }}-${{ steps.plan.outputs.fingerprint_arm }}
          path: artifacts/armeabi-v7a/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  image:
    name: Ensure compatible prepared Chromium image
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-chromium-image.yml
    secrets: inherit

  build:
    name: Build and verify ${{ matrix.arch }}
    needs: [plan, image]
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-unified-arch.yml
    with:
      arch: ${{ matrix.arch }}
      fingerprint: ${{ matrix.fingerprint }}
      certificate: ${{ needs.plan.outputs.certificate }}
      image: ${{ needs.image.outputs.image }}
      runner: ${{ inputs.runner }}
      signing: ${{ inputs.signing }}
      auto_continue: ${{ inputs.auto_continue }}
    secrets: inherit

  cleanup:
    name: Retain the current image after all consumers finish
    needs: [plan, image, build]
    if: always() && !cancelled() && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Remove superseded images only when other runs are idle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: argon-build
          KEEP_TAG: branch-main
        run: python3 .github/ci/prune-prepared-images.py --ignore-current-consumer
