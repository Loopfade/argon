name: Проверка Argon и правил доверия сертификатам
on:
  push:
    paths-ignore:
      - '.github/workflows/update-dashboard.yml'
      - '.github/workflows/deploy-dashboard.yml'
      - 'index.html'
      - 'dashboard-data.json'
      - '.nojekyll'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '.github/workflows/update-dashboard.yml'
      - '.github/workflows/deploy-dashboard.yml'
      - 'index.html'
      - 'dashboard-data.json'
      - '.nojekyll'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cleanup:
    name: Очистить кеши закрытых запросов на слияние
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.base.ref == 'main'
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Удалить кеши закрытых запросов на слияние
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref] | @tsv' |
          while read -r cache_id ref; do
            [[ "$cache_id" =~ ^[0-9]+$ ]] || continue
            [[ "$ref" =~ ^refs/pull/([0-9]+)/merge$ ]] || continue

            pr_number="${BASH_REMATCH[1]}"
            state=$(gh api "repos/$GH_REPO/pulls/$pr_number" --jq '.state')
            if [[ "$state" == closed ]]; then
              echo "Удаление кеша $cache_id закрытого запроса №$pr_number ($ref)"
              gh api --method DELETE "repos/$GH_REPO/actions/caches/$cache_id" >/dev/null
            fi
          done
  validate:
    name: Проверить исходники, патчи и поведение Argon
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получить исходники
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          persist-credentials: false
      - name: Проверить патчи и закреплённые входные данные
        run: |
          for arch in arm64 arm; do
            python3 scripts/preflight.py --inputs-only --arch "$arch"
            python3 scripts/configure_build.py --arch "$arch" --output ".build/args/$arch/args.gn"
          done
          python3 -m unittest discover -s tests -v
          bash -n build.sh
          bash -n build-arm64.sh
          bash -n scripts/prepare_chromium.sh
          for script in .github/ci/*.sh; do bash -n "$script"; done
      - name: Настроить Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Проверить настройки домашней страницы и обмен сохранёнными данными
        run: node --test tests/homepage/*.test.mjs
      - name: Проверить взаимодействия с домашней страницей в Chromium
        env:
          ARGON_UI_ARTIFACTS: ${{ runner.temp }}/argon-homepage-screenshots
        run: |
          npm install --prefix "$RUNNER_TEMP/argon-homepage-ui" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/argon-homepage-ui/node_modules/.bin/playwright" install --with-deps chromium
          ARGON_PLAYWRIGHT_MODULE="$RUNNER_TEMP/argon-homepage-ui/node_modules/playwright/index.mjs" node tests/homepage/ui-check.mjs
      - name: Загрузить снимки домашней страницы
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-ui-${{ github.sha }}
          path: ${{ runner.temp }}/argon-homepage-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Проверить патч домашней страницы на закреплённом Chromium
        run: python3 tests/check_homepage_upstream.py
      - name: Проверить патчи сертификатов и JNI на закреплённых исходниках
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/check_upstream_patches.py
      - name: Проверить фоновое воспроизведение от ввода домена до правил медиасессии
        run: python3 tests/check_background_playback_flow.py
      - name: Получить закреплённую версию BoringSSL
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("build-lock.json"))["boringssl_commit"])')
          git init .build/boringssl
          git -C .build/boringssl remote add origin https://github.com/google/boringssl.git
          git -C .build/boringssl fetch --depth=1 origin "$revision"
          git -C .build/boringssl checkout --detach "$revision"
      - name: Проверить рабочие ограничения DNS и IP
        run: |
          cmake -S tests -B .build/policy-tests -DBORINGSSL_SOURCE_DIR="$PWD/.build/boringssl" -DCMAKE_BUILD_TYPE=Release
          cmake --build .build/policy-tests --target scoped_ca_test -j 4
          ctest --test-dir .build/policy-tests --output-on-failure
  domain-policy:
    name: Проверить графы Android и доменную политику
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Получить исходники
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Освободить место на временном исполнителе GitHub
        if: runner.environment == 'github-hosted'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/swift
          df -h .
      - name: Настроить Docker Buildx для определения digest образа
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Использовать совместимый подготовленный образ Chromium
        id: prepared
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "cache=ghcr.io/$owner/argon-build:branch-main" >> "$GITHUB_OUTPUT"
          python3 .github/ci/full-build.py probe-image --image "ghcr.io/$owner/argon-build:branch-main"
      - name: Подготовить исходники и проверить доменную политику в BuildKit
        if: steps.prepared.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/chromium/Dockerfile
          target: domain-policy-tests
          load: false
          push: false
          cache-from: type=registry,ref=${{ steps.prepared.outputs.cache }}
          provenance: false
          sbom: false
      - name: Собрать и выполнить тесты доменной политики Chromium
        if: steps.prepared.outputs.exists == 'true'
        env:
          PREPARED_IMAGE: ${{ steps.prepared.outputs.image }}
        run: |
          set -euo pipefail
          image="${PREPARED_IMAGE:?Missing compatible prepared image}"
          python3 .github/ci/pull-prepared-image.py "$image"
          docker run --rm --user 0 --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$image" bash -c '
              git config --global --add safe.directory "*"
              bash /workspace/.github/ci/test-domain-policy.sh /opt/argon/chromium/src /opt/argon/depot_tools
            '

