name: Publish release from verified artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build Argon workflow run ID'
        required: true
        type: string
        default: '36526029956'
      artifact_name:
        description: 'Artifact name from the successful build'
        required: true
        type: string
        default: 'Argon-arm64-dfad680f891d36c4563c53af38263db87e91caff'
      tag:
        description: 'Release tag'
        required: true
        type: string
        default: 'v154.0.8037.57-argon.1'
      target_sha:
        description: 'Commit used for the verified build'
        required: true
        type: string
        default: 'dfad680f891d36c4563c53af38263db87e91caff'
      title:
        description: 'Release title'
        required: true
        type: string
        default: 'Argon 154.0.8037.57 (arm64-v8a)'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified arm64 release
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Select public release assets
        run: |
          set -euo pipefail
          mkdir public-assets

          mapfile -t apks < <(find release-assets -maxdepth 1 -type f -name 'Argon-*-release-arm64-v8a.apk' | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release arm64 APK, found ${#apks[@]}." >&2
            exit 1
          fi

          apk="${apks[0]}"
          required=(
            "$apk"
            "$apk.sha256"
            "release-assets/Chromium-LICENSE.txt"
            "release-assets/Ruthenium-LICENSE.txt"
            "release-assets/Titanium-LICENSE.txt"
          )
          for asset in "${required[@]}"; do
            test -f "$asset" || { echo "Missing required release asset: $asset" >&2; exit 1; }
            cp "$asset" public-assets/
          done

      - name: Replace old release and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ inputs.target_sha }}
          RELEASE_TITLE: ${{ inputs.title }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi

          mapfile -d '' assets < <(find public-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} != 5 )); then
            echo "Expected exactly five public release assets, found ${#assets[@]}." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes "Built and verified from main by [Build Argon run #$SOURCE_RUN](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN). Chromium 154.0.8037.57, arm64-v8a, signed with the repository release key."

          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
