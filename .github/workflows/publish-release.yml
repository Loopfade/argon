name: Publish release from verified artifact

on:
  workflow_run:
    workflows: [Build Argon]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build Argon workflow run ID'
        required: true
        type: string
      artifact_name:
        description: 'Artifact name from the successful build'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  # Releases and tags are repository-global mutable resources. Serialize every
  # publisher run so manual and automatic publications cannot race each other.
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    # Automatic publication is limited to trusted main-branch Build Argon runs.
    # Pull requests and arbitrary manual Build Argon variants never auto-release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'workflow_run' ||
        github.event.workflow_run.event == 'push'))
    name: Publish verified arm64 release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_name || format('Argon-arm64-{0}', github.event.workflow_run.head_sha) }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Verify release provenance and select public assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir public-assets

          selection=$(python3 scripts/release_policy.py locate-artifact --root release-assets)
          apk=$(jq -er '.apk' <<<"$selection")
          checksum=$(jq -er '.checksum' <<<"$selection")
          metadata=$(jq -er '.metadata' <<<"$selection")
          asset_dir=$(jq -er '.asset_dir' <<<"$selection")
          chromium_license=$(jq -er '.chromium_license' <<<"$selection")
          ruthenium_license=$(jq -er '.ruthenium_license' <<<"$selection")
          titanium_license=$(jq -er '.titanium_license' <<<"$selection")

          source_sha=$(jq -er '.source_commit' "$metadata")
          version=$(jq -er '.inputs.chromium_version' "$metadata")
          release_revision=$(jq -er '.inputs.argon_revision | select(type == "number")' "$metadata")
          abi=$(jq -er '.abi' "$metadata")
          signing_mode=$(jq -er '.signing_mode' "$metadata")
          metadata_digest=$(jq -er '.apk_sha256' "$metadata")
          actual_digest=$(sha256sum "$apk" | awk '{print $1}')

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid source commit in build-info.json: $source_sha" >&2
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid Chromium version in build-info.json: $version" >&2
            exit 1
          }
          [[ "$release_revision" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid Argon release revision in build-info.json: $release_revision" >&2
            exit 1
          }
          [[ "$abi" == arm64-v8a ]] || { echo "Unexpected ABI: $abi" >&2; exit 1; }
          [[ "$signing_mode" == release ]] || { echo "Artifact is not release-signed." >&2; exit 1; }
          [[ "$metadata_digest" == "$actual_digest" ]] || {
            echo "APK digest does not match build-info.json." >&2
            exit 1
          }

          expected_apk="Argon-${version}-release-arm64-v8a.apk"
          [[ "$(basename "$apk")" == "$expected_apk" ]] || {
            echo "APK filename does not match build metadata: $(basename "$apk")" >&2
            exit 1
          }

          (
            cd "$asset_dir"
            sha256sum -c "$(basename "$checksum")"
          )

          if [[ "$EVENT_NAME" == workflow_run ]]; then
            [[ "$source_sha" == "$AUTO_SHA" ]] || {
              echo "Artifact source SHA $source_sha does not match triggering run SHA $AUTO_SHA." >&2
              exit 1
            }
            source_run="$AUTO_RUN_ID"
          else
            run_json=$(gh api "repos/$GH_REPO/actions/runs/$MANUAL_RUN_ID")
            run_repo=$(jq -er '.repository.full_name' <<<"$run_json")
            run_name=$(jq -er '.name' <<<"$run_json")
            run_event=$(jq -er '.event' <<<"$run_json")
            run_conclusion=$(jq -er '.conclusion' <<<"$run_json")
            run_head_branch=$(jq -er '.head_branch' <<<"$run_json")
            run_head_sha=$(jq -er '.head_sha' <<<"$run_json")

            [[ "$run_repo" == "$GH_REPO" ]] || {
              echo "Run $MANUAL_RUN_ID belongs to $run_repo, not $GH_REPO." >&2
              exit 1
            }
            [[ "$run_name" == "Build Argon" ]] || {
              echo "Run $MANUAL_RUN_ID is not a Build Argon workflow run." >&2
              exit 1
            }
            [[ "$run_conclusion" == success ]] || {
              echo "Run $MANUAL_RUN_ID did not complete successfully." >&2
              exit 1
            }
            [[ "$run_head_branch" == main ]] || {
              echo "Run $MANUAL_RUN_ID was built from $run_head_branch, not main." >&2
              exit 1
            }
            [[ "$run_head_sha" == "$source_sha" ]] || {
              echo "Artifact source SHA $source_sha does not match run SHA $run_head_sha." >&2
              exit 1
            }
            case "$run_event" in
              push|workflow_run|workflow_dispatch) ;;
              *)
                echo "Run $MANUAL_RUN_ID has unsupported event $run_event." >&2
                exit 1
                ;;
            esac
            source_run="$MANUAL_RUN_ID"
          fi

          # A long build may finish after documentation-only commits land on
          # main. Those commits do not invalidate the verified APK. Any code,
          # CI, or other repository change does, and manual recovery follows
          # the same rule so GITHUB_TOKEN never targets an unrelated old tree.
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$source_sha" != "$current_main" ]]; then
            compare_json=$(gh api "repos/$GH_REPO/compare/$source_sha...$current_main")
            if ! python3 scripts/release_policy.py check-drift <<<"$compare_json"; then
              if [[ "$EVENT_NAME" == workflow_run ]]; then
                echo "::notice::Skipping stale Build Argon run $source_run: main contains non-documentation changes after $source_sha."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Manual publication is only allowed from current main or across documentation-only drift." >&2
              exit 1
            fi
            echo "::notice::Allowing publication across documentation-only main drift: $source_sha -> $current_main."
          fi

          for asset in             "$apk"             "$checksum"             "$chromium_license"             "$ruthenium_license"             "$titanium_license"
          do
            cp "$asset" public-assets/
          done

          target_sha="$source_sha"
          tag="v${version}-argon.${release_revision}"
          title="Argon ${version} (arm64-v8a)"

          {
            echo "publish=true"
            echo "target_sha=$target_sha"
            echo "source_run=$source_run"
            echo "tag=$tag"
            echo "title=$title"
            echo "version=$version"
            echo "release_revision=$release_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Publish immutable verified release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ steps.release.outputs.target_sha }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.release_revision }}
          SOURCE_RUN: ${{ steps.release.outputs.source_run }}
        run: |
          set -euo pipefail

          # Close the race between provenance verification and release creation.
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [[ "$RELEASE_TARGET" != "$current_main" ]]; then
            compare_json=$(gh api "repos/$GH_REPO/compare/$RELEASE_TARGET...$current_main")
            if ! python3 scripts/release_policy.py check-drift <<<"$compare_json"; then
              if [[ "$EVENT_NAME" == workflow_run ]]; then
                echo "::notice::Skipping stale release: main changed beyond documentation after $RELEASE_TARGET."
                exit 0
              fi
              echo "Manual publication became stale before release creation." >&2
              exit 1
            fi
          fi

          mapfile -d '' assets < <(find public-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} != 5 )); then
            echo "Expected exactly five public release assets, found ${#assets[@]}." >&2
            exit 1
          fi

          release_json=$(mktemp)
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" >"$release_json" 2>/dev/null; then
            python3 scripts/release_policy.py verify-release \
              --release-json "$release_json" \
              --target-sha "$RELEASE_TARGET" \
              --assets public-assets
            release_url=$(jq -er '.html_url' "$release_json")
            echo "::notice::Release $RELEASE_TAG already exists with the exact verified target and assets; treating this run as successful."
            printf '%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag_json=$(mktemp)
          tag_exists=false
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >"$tag_json" 2>/dev/null; then
            python3 scripts/release_policy.py verify-tag \
              --tag-json "$tag_json" \
              --target-sha "$RELEASE_TARGET"
            tag_exists=true
          fi

          notes="Built and verified from main by [Build Argon run #$SOURCE_RUN](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN). Chromium $RELEASE_VERSION, Argon revision $RELEASE_REVISION, arm64-v8a, signed with the repository release key."
          if [[ "$tag_exists" == true ]]; then
            release_url=$(gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TITLE" \
              --notes "$notes")
          else
            release_url=$(gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$RELEASE_TARGET" \
              --title "$RELEASE_TITLE" \
              --notes "$notes")
          fi

          printf '%s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
