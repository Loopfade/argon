name: Import merged PR compiler cache

on:
  workflow_run:
    workflows: [Transfer compiler cache]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: argon-import-merged-pr-cache
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/transfer-compiler-cache.yml
    with:
      mode: import
      source_run: ${{ format('{0}', github.event.workflow_run.id) }}
