name: Cancel stale PR builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-pr-builds.yml'
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel:
    name: Cancel Build Argon runs for closed PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel stale pull-request builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GH_REPO/actions/workflows/build.yml/runs?per_page=100" \
            --jq '.workflow_runs[]
              | select(.event == "pull_request" and .status != "completed")
              | [.id, .head_branch, (.head_repository.owner.login // "")]
              | @tsv' |
          while IFS=$'\t' read -r run_id head_branch head_owner; do
            [[ -n "$run_id" && -n "$head_branch" && -n "$head_owner" ]] || continue

            open_prs=$(gh api --method GET "repos/$GH_REPO/pulls" \
              -f state=open \
              -f "head=$head_owner:$head_branch" \
              -f per_page=1 \
              --jq 'length')

            if (( open_prs == 0 )); then
              echo "Cancelling stale PR Build Argon run $run_id ($head_owner:$head_branch)"
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" >/dev/null || true
            fi
          done
