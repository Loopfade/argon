name: Migrate GitHub Pages to main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-pages-to-main.yml'

permissions:
  contents: write
  pages: write

jobs:
  migrate:
    name: Move Pages source and remove gh-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Point GitHub Pages at main root
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -n '{build_type:"legacy",source:{branch:"main",path:"/"}}')
          gh api --method PUT "repos/$GH_REPO/pages" --input - <<<"$payload" >/dev/null

          page=$(gh api "repos/$GH_REPO/pages")
          branch=$(jq -r '.source.branch // empty' <<<"$page")
          path=$(jq -r '.source.path // empty' <<<"$page")
          [[ "$branch" == main ]] || {
            echo "::error::GitHub Pages source is still '$branch', expected 'main'."
            exit 1
          }
          [[ "$path" == / ]] || {
            echo "::error::GitHub Pages path is still '$path', expected '/'."
            exit 1
          }

      - name: Delete obsolete gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$GH_REPO/git/ref/heads/gh-pages" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/gh-pages"
            echo "Deleted gh-pages after Pages source switched to main."
          else
            echo "gh-pages is already absent."
          fi
