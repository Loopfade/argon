name: Update Argon dashboard snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dashboard.yml'
      - '.github/ci/update-dashboard.py'
  workflow_run:
    workflows: [Build Argon]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: argon-dashboard-snapshot
  cancel-in-progress: true

jobs:
  update:
    name: Refresh GitHub Pages dashboard data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build authenticated dashboard snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/update-dashboard.py

      - name: Publish snapshot to main
        if: steps.snapshot.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/update-dashboard.py --publish
