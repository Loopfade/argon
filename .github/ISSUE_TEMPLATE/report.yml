name: Ошибка или предложение
description: Сообщить об ошибке или предложить улучшение Argon
body:
  - type: markdown
    attributes:
      value: |
        ### Перед отправкой
        Проверьте, есть ли такая ошибка в [Chromium](https://crbug.com/),
        [Titanium](https://github.com/jqssun/android-titanium-browser/issues)
        или [обращениях Argon](https://github.com/Loopfade/argon/issues).

        Опишите проблему, связанную с изменениями Argon. Для предложения новой
        функции укажите, какую задачу она решает и можно ли решить её расширением
        или пользовательским скриптом.

  - type: checkboxes
    id: checklist
    attributes:
      label: Проверка перед отправкой
      description: Подтвердите, что проверили существующие обращения.
      options:
        - label: Я проверил crbug.com — такая ошибка Chromium ещё не зарегистрирована.
          required: true
        - label: Я проверил обращения Titanium и Argon — такого обращения ещё нет.
          required: true

  - type: textarea
    id: environment
    attributes:
      label: Устройство и версии
      description: Укажите модель устройства, версию Android и версию Argon.
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Опишите шаги воспроизведения, ожидаемый и фактический результат. Для предложения опишите желаемое поведение.
    validations:
      required: true
