  <header class="header">
    <div class="brand" aria-label="Argon — новая вкладка"><svg class="brand-icon" aria-hidden="true"><use href="#i-brand"/></svg><span class="brand-word">argon</span></div>
    <div class="appearance" role="group" aria-label="Оформление страницы">
      <button type="button" data-theme-choice="light" title="Светлая тема" aria-label="Светлая тема" aria-pressed="false"><svg aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button type="button" data-theme-choice="dark" title="Тёмная тема" aria-label="Тёмная тема" aria-pressed="false"><svg aria-hidden="true"><use href="#i-moon"/></svg></button>
      <button type="button" data-theme-choice="system" title="Как в системе" aria-label="Тема системы" aria-pressed="true"><svg aria-hidden="true"><use href="#i-monitor"/></svg></button>
    </div>
  </header>
  <main class="workspace">
    <div class="search-wrap">
      <form id="search-form" class="search" role="search">
        <button type="button" id="engine-trigger" class="engine-trigger" aria-label="Выбрать поисковую систему" aria-expanded="false" aria-controls="engine-menu"><span id="selected-engine-icon" class="engine-icon"></span><span id="selected-engine-name" class="engine-name">Google</span><svg class="chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <input id="search-input" class="search-input" type="search" name="q" placeholder="Поиск или адрес сайта" aria-label="Поиск или адрес сайта" autocomplete="off" spellcheck="false">
        <button class="search-submit" type="submit" title="Искать" aria-label="Искать"><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
      </form>
      <div id="engine-menu" class="popover" hidden></div>
    </div>
    <section class="favorites" aria-labelledby="favorites-heading">
      <div class="section-row"><h1 id="favorites-heading" class="section-label">Избранное</h1><label class="edit-lock"><span class="edit-lock-copy"><span id="edit-lock-label">Закреплено</span><small id="edit-lock-note"></small></span><input id="edit-lock" type="checkbox" role="switch" aria-label="Закрепить изменения ярлыков" checked><span class="edit-lock-rail" aria-hidden="true"><span class="edit-lock-thumb" id="edit-lock-icon"><svg><use href="#i-lock"/></svg></span></span></label></div>
      <div id="shortcut-grid" class="shortcut-grid"></div>
    </section>
  </main>
  <footer class="footer"><div class="keyboard-hints" aria-hidden="true"><span><kbd>/</kbd> поиск</span><span><kbd>esc</kbd> закрыть</span></div><button class="settings-button" id="settings-button"><svg aria-hidden="true"><use href="#i-settings"/></svg>Настроить</button></footer>
  <div id="modal-root"></div><div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
